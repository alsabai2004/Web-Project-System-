<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>إضافة طالب</title>
    <style>
        body {
            background-color: #0f3460;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #0f3460;
            padding: 15px;
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 24px;
            color: #e94560;
            font-weight: bold;
        }
        .nav a {
            background: #e94560;
            padding: 8px 15px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            margin: 5px;
            display: inline-block;
        }
        .nav a:hover { background: #c72a48; }
        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
        }
        h2 { color: #e94560; margin-bottom: 20px; }
        input {
            background: #1e2a47;
            padding: 12px;
            border: none;
            border-radius: 10px;
            color: white;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            background: #10b981;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        button:hover { background: #059669; }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #1e2a47;
            border-radius: 10px;
            border-left: 5px solid #10b981;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            border-top: 1px solid #e94560;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📚 S.M.S</div>
        <div class="nav">
            <a href="home.html">🏠 الرئيسية</a>
            <a href="add.html">➕ إضافة</a>
            <a href="view.html">📋 عرض</a>
            <a href="delete.html">🗑️ حذف</a>
            <a href="index.html" onclick="logout()">🚪 خروج</a>
        </div>
    </div>

    <div class="container">
        <h2>➕ إضافة طالب جديد</h2>
        <input type="text" id="id" placeholder="رقم الطالب (ID)">
        <input type="text" id="name" placeholder="الاسم الكامل">
        <input type="text" id="department" placeholder="القسم">
        <input type="number" id="level" placeholder="المستوى (1-4)">
        <input type="number" id="gpa" placeholder="المعدل (0-4)" step="0.01">
        <button onclick="addStudent()">💾 حفظ الطالب</button>
        <div id="addResult" class="result" style="display:none;"></div>
    </div>

    <div class="footer">
        Student Management System © 2026
    </div>

    <script src="script.js"></script>
</body>
</html>
