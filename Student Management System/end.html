<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>قيد التطوير</title>
    <style>
        body {
            background-color: #0f3460;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        .box {
            background: #16213e;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #e94560;
        }
        h1 { color: #e94560; }
        p { color: #ccc; }
        .btn {
            background: #e94560;
            padding: 10px 20px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }
        .btn:hover { background: #c72a48; }
    </style>
</head>
<body>
    <div class="box">
        <h1>⚠️ قيد التطوير</h1>
        <p>هذه الصفحة سيتم إضافتها قريباً</p>
        <a href="home.html" class="btn">🏠 العودة للرئيسية</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
