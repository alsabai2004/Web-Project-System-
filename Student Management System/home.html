<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>الرئيسية</title>
    <style>
        body {
            background-color: #0f3460;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            background: #0f3460;
            padding: 15px;
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo {
            font-size: 24px;
            color: #e94560;
            font-weight: bold;
        }
        .nav a {
            background: #e94560;
            padding: 8px 15px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            margin: 5px;
            display: inline-block;
        }
        .nav a:hover { background: #c72a48; }
        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: #16213e;
            padding: 20px;
            border-radius: 15px;
        }
        h2 { color: #e94560; margin-bottom: 20px; }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            border-top: 1px solid #e94560;
            color: #aaa;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">📚 S.M.S</div>
        <div class="nav">
            <a href="home.html">🏠 الرئيسية</a>
            <a href="add.html">➕ إضافة</a>
            <a href="view.html">📋 عرض</a>
            <a href="delete.html">🗑️ حذف</a>
            <a href="index.html" onclick="logout()">🚪 خروج</a>
        </div>
    </div>

    <div class="container">
        <h2>🏠 لوحة التحكم</h2>
        <div style="background: #1e2a47; padding: 20px; border-radius: 15px; text-align: center;">
            <p style="font-size: 18px;">مرحباً بك في نظام إدارة الطلاب</p>
            <p>عدد الطلاب المسجلين: <strong id="totalCount">0</strong></p>
        </div>
    </div>

    <div class="footer">
        Student Management System © 2026
    </div>

    <script src="script.js"></script>
    <script>
        updateTotalCount();
    </script>
</body>
</html>
