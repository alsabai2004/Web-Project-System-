<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Student Management System</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: white;
            font-family: 'Tahoma', 'Arial', 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        h1 { color: #e94560; margin-bottom: 20px; }
        input {
            background: #16213e;
            padding: 10px;
            border: none;
            border-radius: 10px;
            color: white;
            width: 250px;
        }
        button {
            background: #e94560;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            width: 100px;
        }
        .log {
            background: #16213e;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="log">
        <h1>Student Management System</h1>
        <input type="text" id="username" placeholder="Username"> <br><br>
        <input type="password" id="pass" placeholder="Password"> <br><br>
        <button onclick="login()">دخول</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
